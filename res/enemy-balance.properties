# Enemy balance values (Team Entities enemy overhaul).
# Edit and save, then start a new level. No Java compilation is required.
# Override location: java -Dinvaders.enemyBalance=<path> ...
# A missing key uses the built-in default shown here. An invalid value stops the game with an error.
#
# Units: the game runs at 60 frames per second.
#   speed, bulletSpeed : pixels per frame   (2.0 = 120 pixels per second)
#   fireInterval       : frames between shots (60 = one shot per second)
#   pixelSize          : size of one sprite pixel on screen (2 = normal, 4 = double size)

# --- Formation ---
# Extra pixels between formation members flying the same path (>= 0).
formation.gap=14

# --- Normal: no bullets, flies in formation ---
normal.health=1
normal.points=10
normal.speed=2.0
normal.formationSize=5

# --- Shooter: fires one bullet in the direction it is flying ---
shooter.health=1
shooter.points=20
shooter.speed=1.5
shooter.formationSize=4
shooter.fireInterval=90
shooter.bulletSpeed=4.0

# --- Bat: fires one bullet at the player ---
bat.health=1
bat.points=30
bat.speed=1.8
bat.formationSize=3
bat.fireInterval=120
bat.bulletSpeed=3.5

# --- Assassin: flies fast at the player, alone ---
assassin.health=1
assassin.points=40
assassin.speed=5.0
assassin.formationSize=1

# --- Tank: slow, big, tough; fires a fan of three bullets at the player ---
# spreadDegrees: angle between the fan's bullets.
tank.health=8
tank.points=100
tank.speed=0.6
tank.formationSize=1
tank.fireInterval=150
tank.bulletSpeed=3.0
tank.pixelSize=4
tank.spreadDegrees=15

# --- Movement pattern shapes ---
# Heights are fractions of the play area (0 = just below the HUD line, 1 = bottom).
# Each Min/Max pair is a random range; Min must not be above Max.

# Pattern 1, curve: height where the curve reaches the far side.
pattern.curve.endYMin=0.5
pattern.curve.endYMax=0.8

# Pattern 3, side diagonal: start height, and pixels down per pixel across.
pattern.sideDiagonal.startYMin=0.1
pattern.sideDiagonal.startYMax=0.45
pattern.sideDiagonal.slopeMin=0.35
pattern.sideDiagonal.slopeMax=0.5

# Pattern 4, semicircle: start height and diameter.
pattern.semicircle.startYMin=0.1
pattern.semicircle.startYMax=0.25
pattern.semicircle.diameterMin=0.45
pattern.semicircle.diameterMax=0.6

# Pattern 5, gentle diagonal: sideways drift over the whole fall, fraction of screen width.
pattern.gentleDiagonal.driftMin=0.12
pattern.gentleDiagonal.driftMax=0.25
