# Enemy balance values (Team Entities enemy overhaul).
# Edit and save, then start a new level. No Java compilation is required.
# Override location: java -Dinvaders.enemyBalance=<path> ...
# A missing key uses the built-in default shown here. An invalid value stops the game with an error.
#
# Units: the game runs at 60 frames per second.
#   speed, bulletSpeed : pixels per frame   (2.0 = 120 pixels per second)
#   fireInterval       : frames between shots (60 = one shot per second)
#   pixelSize          : size of one sprite pixel on screen (2 = normal, 4 = double size)
#   threat             : how much one enemy weighs on a level's pressure (see res/levels).
#                        A formation weighs threat x formationSize.

# --- Formation ---
# Extra pixels between formation members flying the same path (>= 0).
formation.gap=14

# --- Normal: no bullets, flies in formation ---
normal.health=1
normal.points=10
normal.speed=2.0
normal.formationSize=5
normal.threat=0.2

# --- Shooter: weaves down (sine wave) and fires one bullet straight down ---
shooter.health=1
shooter.points=20
shooter.speed=1.5
shooter.formationSize=4
shooter.fireInterval=90
shooter.bulletSpeed=4.0
shooter.threat=0.4

# --- Bat: fires one bullet at the player ---
bat.health=1
bat.points=30
bat.speed=1.8
bat.formationSize=3
bat.fireInterval=120
bat.bulletSpeed=3.5
bat.threat=1.0

# --- Assassin: flies fast at the player, alone ---
assassin.health=1
assassin.points=40
assassin.speed=5.0
assassin.formationSize=1
assassin.threat=2.0

# --- Tank: slow, big, tough; fires a fan of three bullets at the player ---
# spreadDegrees: angle between the fan's bullets.
tank.health=8
tank.points=100
tank.speed=0.6
tank.formationSize=1
tank.fireInterval=150
tank.bulletSpeed=3.0
tank.pixelSize=4
tank.spreadDegrees=15
tank.threat=4.0

# --- Elites: late-game versions of the types above ---
# Same sprite and routes as their base type, drawn bigger in a colour of their own.
# Which stages they appear in is set by weight.eliteXxx in res/levels.

# Elite normal: tougher, drops slow bullets straight down.
eliteNormal.health=3
eliteNormal.points=40
eliteNormal.speed=2.2
eliteNormal.formationSize=4
eliteNormal.fireInterval=150
eliteNormal.bulletSpeed=2.5
eliteNormal.pixelSize=3
eliteNormal.threat=0.6

# Elite shooter: fires a fan of three straight down.
eliteShooter.health=3
eliteShooter.points=70
eliteShooter.speed=1.6
eliteShooter.formationSize=3
eliteShooter.fireInterval=80
eliteShooter.bulletSpeed=4.0
eliteShooter.pixelSize=3
eliteShooter.spreadDegrees=15
eliteShooter.threat=1.2

# Elite bat: fires bursts of three quick shots at the player.
eliteBat.health=4
eliteBat.points=100
eliteBat.speed=1.9
eliteBat.formationSize=2
eliteBat.fireInterval=130
eliteBat.bulletSpeed=3.8
eliteBat.pixelSize=3
eliteBat.threat=2.5

# Elite assassin: tougher, sheds rings of bullets while it charges.
# spreadDegrees: angle between ring bullets (45 = eight bullets).
eliteAssassin.health=3
eliteAssassin.points=150
eliteAssassin.speed=5.5
eliteAssassin.formationSize=1
eliteAssassin.fireInterval=50
eliteAssassin.bulletSpeed=2.5
eliteAssassin.pixelSize=3
eliteAssassin.spreadDegrees=45
eliteAssassin.threat=4.0

# Elite tank: very tough, fires a fan of five at the player.
eliteTank.health=20
eliteTank.points=350
eliteTank.speed=0.6
eliteTank.formationSize=1
eliteTank.fireInterval=130
eliteTank.bulletSpeed=3.0
eliteTank.pixelSize=5
eliteTank.spreadDegrees=12
eliteTank.threat=8.0

# --- Movement pattern shapes ---
# Heights are fractions of the play area (0 = just below the HUD line, 1 = bottom).
# Each Min/Max pair is a random range; Min must not be above Max.

# Pattern 1, curve: height where the curve reaches the far side.
pattern.curve.endYMin=0.5
pattern.curve.endYMax=0.8

# Pattern 3, side diagonal: start height, and pixels down per pixel across.
pattern.sideDiagonal.startYMin=0.1
pattern.sideDiagonal.startYMax=0.45
pattern.sideDiagonal.slopeMin=0.35
pattern.sideDiagonal.slopeMax=0.5

# Pattern 4, semicircle: start height, height of the swing (diameter),
# and how far it reaches into the screen (reach, fraction of screen width; at most 0.9).
pattern.semicircle.startYMin=0.1
pattern.semicircle.startYMax=0.25
pattern.semicircle.diameterMin=0.45
pattern.semicircle.diameterMax=0.6
pattern.semicircle.reachMin=0.45
pattern.semicircle.reachMax=0.6

# Pattern 5, gentle diagonal: sideways drift over the whole fall, fraction of screen width.
pattern.gentleDiagonal.driftMin=0.12
pattern.gentleDiagonal.driftMax=0.25

# Pattern 7, sine wave: falls weaving left and right (shooters).
# amplitude: how far it swings to each side, fraction of screen width.
# wavelength: how far it falls during one full left-right swing, fraction of play area height.
pattern.sineWave.amplitudeMin=0.12
pattern.sineWave.amplitudeMax=0.2
pattern.sineWave.wavelengthMin=0.35
pattern.sineWave.wavelengthMax=0.5
