# Item System (Team CS) balance values.
# Edit and save, then start a new game run. No Java compilation is required.
# Override location: java -Dinvaders.itemBalance=<path> ...
# A missing key uses the built-in default shown here. An invalid value stops the game with an error.

# --- Item effects ---
# Durations: milliseconds (> 0). Charges: positive integer.
shield.durationMillis=8000
shield.charges=1
freeze.durationMillis=4000

# --- Boost / score boost (start when caught, see pickup.autoUse) ---
# Duration in milliseconds (> 0) and multiplier (> 1) of the base value; using one while active restarts its time.
boost.durationMillis=7000
boost.multiplier=1.5
scoreBoost.durationMillis=7000
scoreBoost.multiplier=2.0

# --- Bullet upgrades: rapid fire / bullet speed / spread / pierce (stack for the whole run) ---
# Each pickup adds one stack and the effect lasts until the run ends.
# The game adds the item bonus on top of the base value; the base value is not changed.
#   rapidFire.bonus   : extra share of the ship's own base fire rate, scaled by log2(1 + stacks):
#                       1 stack = 1x, 2 = 1.58x, 3 = 2x, 6 = 2.81x (gains shrink).
#                       0.35 -> +35% at 1 stack, about +98% (twice the base rate) at 6 stacks, for every ship.
#   bulletSpeed.bonus : extra pixels per frame for every stack (base bullet: 6 px/frame).
#                       1 with 3 stacks -> 7, 8, 9 px/frame (+50% at most).
#   spread            : a new shot pattern per stack (Team Entities): 1 two front shots side by side,
#                       2 a diagonal pair, 3 three front shots, 4 a shot backwards, 5 a shot aimed at
#                       the nearest enemy, 6 a wider diagonal pair.
#     spread.frontGap           : px between side-by-side front shots (stacks 1 and 3).
#     spread.diagonalSpeedX     : sideways px per frame of the diagonal pair (3 with 6 up = about 27 degrees).
#     spread.wideDiagonalSpeedX : same for the wider pair at stack 6 (6 with 6 up = 45 degrees).
#   pierce            : each bullet passes through one more enemy per stack. A boss still stops the bullet.
# maxStacks (>= 1): no more stacks, and the item stops dropping, at this count.
# dropDecay (0..1): the item's drop weight is multiplied by this once per stack it already has,
# or once per upgrade stack of any kind when drop.upgradeDecay.shared=true (see Drops below).
rapidFire.bonus=0.35
rapidFire.maxStacks=6
rapidFire.dropDecay=0.65
bulletSpeed.bonus=1
bulletSpeed.maxStacks=3
bulletSpeed.dropDecay=0.65
spread.maxStacks=6
spread.frontGap=14
spread.diagonalSpeedX=3
spread.wideDiagonalSpeedX=6
spread.dropDecay=0.55
pierce.maxStacks=3
pierce.dropDecay=0.65
# Bullet power: rapid fire and pierce in one item. Each stack fires faster (fireBonus, same log2 curve
# as rapidFire.bonus: +35%, +55%, +70%, +81%, +90%, +98% at 1-6 stacks), and every pierceEvery (>= 1)
# stacks bullets pass through one more enemy (2 -> pierce 1 / 2 / 3 at 2 / 4 / 6 stacks).
# Rapid fire, bullet speed and pierce no longer drop on their own (drop weight 0 below).
bulletPower.fireBonus=0.35
bulletPower.maxStacks=6
bulletPower.pierceEvery=2
bulletPower.dropDecay=0.55

# --- Life item ---
# Lives cannot go above maxLives through the life item (>= 1). 3 matches the game's starting lives.
# At the cap the life item awards capBonusScore points instead (>= 0).
life.maxLives=3
life.capBonusScore=200

# --- Drops ---
# Probability per kill, inclusive range 0..1.
# With drop.upgrade.probability set, a regular kill rolls twice: drop.regular.probability for basic
# items (life, shield, freeze, boost, score boost) and drop.upgrade.probability for upgrades (bullet
# power, spread). The upgrade chance shrinks as the upgrade weights decay (dropDecay above).
# Remove drop.upgrade.probability to go back to one roll shared by every kind.
drop.regular.probability=0.06
drop.upgrade.probability=0.06
drop.special.probability=1.0
# true: every upgrade's weight shrinks with the total number of upgrades caught (all kinds together),
# so the first one or two come easily and later ones get rare. false: each upgrade counts only its own stacks.
drop.upgradeDecay.shared=true
# Relative selection weights after a successful drop roll (>= 0); 0 disables a kind.
# At least one must be positive if either drop probability is positive.
drop.weight.life=0.6
drop.weight.shield=1
drop.weight.rapidFire=0
drop.weight.bulletSpeed=0
drop.weight.spread=1.8
drop.weight.pierce=0
drop.weight.bulletPower=1.8
drop.weight.freeze=1
drop.weight.boost=1
drop.weight.scoreBoost=1
# Drops fly in a random direction at drop.speed (pixels/second, 0.85x to 1.15x) and bounce off all four
# walls of the play area for drop.bounceMillis (> 0). After that they stop bouncing, fly out past a wall
# and disappear once fully off the play area.
drop.speed=150
drop.bounceMillis=6000
# When a level is cleared, drops still on the field fly to the ship at drop.gatherSpeed (pixels/second, > 0)
# and are picked up before the next level.
drop.gatherSpeed=700
# Legacy, no longer used by the bouncing movement: fallSpeed, horizontalSpeed, directionChangeMillis.
drop.fallSpeed=80
drop.horizontalSpeed=65
drop.directionChangeMillis=700
# Drop size in pixels (> 0).
drop.width=24
drop.height=24
# Legacy compatibility only: drops no longer land or use this lifetime.
drop.groundLifetimeMillis=8000

# --- Inventory ---
# Number of slots for stored (manual) items, positive integer.
inventory.capacity=3
# true: shield, freeze, boost and score boost start the moment they are caught (no slot, no key).
# Catching one while the same effect runs restarts its time. false: store them in slots and use Z/X/C.
pickup.autoUse=true

# --- Equipped items (at most one equipped) ---
# Work for every run while equipped. How they are obtained (e.g. a shop) is up to the caller.
# extraSlots.amount: inventory slots added (> 0).
# magnet.range: center-to-center attraction radius in pixels (> 0).
# magnet.speed: attraction speed in pixels/second (> 0); can move upward to reach the player.
# Once attracted, a drop follows the player until contact, even after leaving the initial radius.
# magnet.convertScore: score for an attracted drop the magnet cannot keep on contact (> 0).
# maxLife.amount: extra lives above life.maxLives the life item may reach (> 0).
# longLasting.extraMillis: milliseconds added to timed active items - shield, freeze, boost, score boost (> 0).
equip.extraSlots.amount=1
equip.magnet.convertScore=50
equip.magnet.range=140
equip.magnet.speed=260
equip.maxLife.amount=1
equip.longLasting.extraMillis=3000
