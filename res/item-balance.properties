# Item System (Team CS) balance values.
# Edit and save, then start a new game run. No Java compilation is required.
# Override location: java -Dinvaders.itemBalance=<path> ...
# A missing key uses the built-in default shown here. An invalid value stops the game with an error.

# --- Item effects ---
# Durations: milliseconds (> 0). Charges: positive integer.
shield.durationMillis=8000
shield.charges=1
freeze.durationMillis=4000

# --- Boost / score boost (stored in a slot, used with a number key) ---
# Duration in milliseconds (> 0) and multiplier (> 1) of the base value; using one while active restarts its time.
boost.durationMillis=7000
boost.multiplier=1.5
scoreBoost.durationMillis=7000
scoreBoost.multiplier=2.0

# --- Bullet upgrades: rapid fire / bullet speed / spread / pierce (stack for the whole run) ---
# Each pickup adds one stack and the effect lasts until the run ends.
# The game adds the item bonus on top of the base value; the base value is not changed.
#   rapidFire.bonus   : extra share of the ship's own base fire rate, scaled by log2(1 + stacks):
#                       1 stack = 1x, 2 = 1.58x, 3 = 2x, 6 = 2.81x (gains shrink).
#                       0.35 -> +35% at 1 stack, about +98% (twice the base rate) at 6 stacks, for every ship.
#   bulletSpeed.bonus : extra pixels per frame for every stack (base bullet: 6 px/frame).
#                       1 with 3 stacks -> 7, 8, 9 px/frame (+50% at most).
#   spread            : one more bullet lane per stack (5 lanes at 4 stacks).
#   pierce            : each bullet passes through one more enemy per stack. A boss still stops the bullet.
# maxStacks (>= 1): no more stacks, and the item stops dropping, at this count.
# dropDecay (0..1): the item's drop weight is multiplied by this once per stack it already has.
rapidFire.bonus=0.35
rapidFire.maxStacks=6
rapidFire.dropDecay=0.7
bulletSpeed.bonus=1
bulletSpeed.maxStacks=3
bulletSpeed.dropDecay=0.7
spread.maxStacks=4
spread.dropDecay=0.7
pierce.maxStacks=3
pierce.dropDecay=0.7

# --- Life item ---
# Lives cannot go above maxLives through the life item (>= 1). 3 matches the game's starting lives.
# At the cap the life item awards capBonusScore points instead (>= 0).
life.maxLives=3
life.capBonusScore=200

# --- Drops ---
# Probability per kill, inclusive range 0..1.
drop.regular.probability=0.15
drop.special.probability=1.0
# Relative selection weights after a successful drop roll (>= 0); 0 disables a kind.
# At least one must be positive if either drop probability is positive.
drop.weight.life=0.6
drop.weight.shield=1
drop.weight.rapidFire=1
drop.weight.bulletSpeed=1
drop.weight.spread=1
drop.weight.pierce=1
drop.weight.freeze=1
drop.weight.boost=1
drop.weight.scoreBoost=1
# Fall speed in pixels/second, drop size in pixels, time on the ground in milliseconds (all > 0).
drop.fallSpeed=80
drop.width=24
drop.height=24
drop.groundLifetimeMillis=8000

# --- Inventory ---
# Number of slots for stored (manual) items, positive integer.
inventory.capacity=3

# --- Equipped items (at most one equipped) ---
# Work for every run while equipped. How they are obtained (e.g. a shop) is up to the caller.
# extraSlots.amount: inventory slots added (> 0).
# magnet.convertScore: score for a landed drop the magnet cannot keep, e.g. a stored item with a full inventory (> 0).
# maxLife.amount: extra lives above life.maxLives the life item may reach (> 0).
# longLasting.extraMillis: milliseconds added to timed active items - shield, freeze, boost, score boost (> 0).
equip.extraSlots.amount=1
equip.magnet.convertScore=50
equip.maxLife.amount=1
equip.longLasting.extraMillis=3000
