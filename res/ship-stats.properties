# Player ship stats (Team CS). Edit, then restart the game.
# Keys are <ship>.<stat>; every value is a whole number above 0.
# A missing key keeps the default in Ship.ShipType; an invalid value is
# logged and ignored.
#
#   speed            movement in px per frame
#   shootingInterval time between shots in milliseconds
#   bulletSpeed      upward bullet speed in px per frame
#   bulletsPerShot   bullets fired per shot, one per barrel, 16 px apart
#   bulletWidth      bullet width in px
#   bulletHeight     bullet height in px

standard.speed=2
standard.shootingInterval=750
standard.bulletSpeed=6
standard.bulletsPerShot=1
standard.bulletWidth=6
standard.bulletHeight=10

fast_move.speed=4
fast_move.shootingInterval=750
fast_move.bulletSpeed=6
fast_move.bulletsPerShot=1
fast_move.bulletWidth=6
fast_move.bulletHeight=10

two_way.speed=1
two_way.shootingInterval=1000
two_way.bulletSpeed=6
two_way.bulletsPerShot=2
two_way.bulletWidth=6
two_way.bulletHeight=10

fast_attack.speed=2
fast_attack.shootingInterval=375
fast_attack.bulletSpeed=6
fast_attack.bulletsPerShot=1
fast_attack.bulletWidth=6
fast_attack.bulletHeight=10

big_bullet.speed=2
