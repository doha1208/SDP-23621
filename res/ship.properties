# Player ship movement values.
# Edit and save, then start a new level. No Java compilation is required.
# Override location: java -Dinvaders.ship=<path> ...
# A missing or invalid value falls back to the default shown here
# (a warning is logged), so a typo never stops the game.

# How high the ship may fly with W/S or the up/down arrows, as a fraction of
# the screen height measured from the top, between 0.0 and 1.0.
#   0.5  = up to the middle of the screen (default)
#   0.25 = up to a quarter from the top
#   0.0  = all the way up to the line under the score bar
#   1.0  = no moving up; the ship stays on its starting row
move.topLimit=0.5
