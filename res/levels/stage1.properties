# Stage 1 difficulty (level director).
# Edit and save, then start the stage again. No Java compilation is required.
# Override directory: java -Dinvaders.levels=<directory> ...   Fixed randomness: -Dinvaders.levelSeed=<number>
# A wrong value or an unknown key stops the game with an error naming it.
#
# How it works: every enemy has a threat value (res/enemy-balance.properties).
# Pressure is the total threat of enemies alive on screen. While the stage runs,
# the director spawns a random formation whenever the gap has passed and the
# formation fits under the pressure cap. The stage ends when the time is up and
# the screen is empty.

# --- Timing (seconds) ---
duration=30
startDelay=1
spawnGap=0.6
spawnGapRandom=0.6

# --- Pressure cap: rises from start to end over the stage ---
pressureStart=4.5
pressureEnd=6

# --- Which enemies appear and how often (relative weights, 0 = never) ---
weight.normal=10
weight.shooter=3
weight.bat=1
weight.assassin=0
weight.tank=0

# --- Stage multipliers on enemy values (1.0 = unchanged; +5% per stage for now) ---
speed=1.00
bulletSpeed=1.00
fireRate=1.00
health=1.0
points=1.0
