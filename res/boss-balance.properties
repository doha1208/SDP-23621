# Boss balance values (Team Entities boss overhaul).
# Edit and save, then start the boss stage again. No Java compilation is required.
# Override path: java -Dinvaders.bossBalance=<file> ...
# Every value must be a number above 0 (summon weights may be 0). A wrong value
# or an unknown key stops the game with an error naming it; a missing key uses
# the built-in default.
#
# Units: times in seconds, speeds in pixels per frame (60 frames per second),
# distances in pixels, angles in degrees.

# ===== Boss 1: fortress (wide ship with three cores) =====
fortress.sideCoreHealth=40
fortress.centerCoreHealth=60
# Points for destroying the last core. Cores give no points of their own.
fortress.defeatPoints=1000
# Sideways sway of the whole ship.
fortress.sway=6
# Pause between two patterns.
fortress.restTime=1.2

# Pattern 1: side cores fire aimed 5-way fans, several volleys.
fortress.fan.bullets=5
fortress.fan.spreadDegrees=12
fortress.fan.volleys=4
fortress.fan.volleyGap=0.45
fortress.fan.bulletSpeed=3.5

# Pattern 2: bombs fly to random spots and burst into rings of bullets.
fortress.bomb.count=3
fortress.bomb.launchGap=0.5
fortress.bomb.speed=3.0
fortress.bomb.bullets=9
fortress.bomb.bulletSpeed=2.8

# Pattern 3: warning, then a wide laser from the center core.
fortress.laser.warning=1.2
fortress.laser.duration=1.6
fortress.laser.width=80

# Pattern 4: crossfire from the sides while a warning column follows the
# player; it stops, then an attack rises from below. If it reaches a core,
# the fortress is stunned.
fortress.sweep.trackTime=2.0
fortress.sweep.lockTime=0.8
fortress.sweep.riseSpeed=10
fortress.sweep.columnWidth=28
fortress.sweep.crossfireGap=0.35
fortress.sweep.crossfireSpeed=3.0
fortress.sweep.stunTime=2.0

# ===== Boss 2: raider (fast, charges) =====
raider.health=110
raider.defeatPoints=1500
raider.speed=1.6

# Pattern 1 (default): roams left and right, fires now and then, and summons
# enemy formations, the type drawn by the summon weights (0 = never).
raider.patrol.time=4.0
raider.patrol.fireGap=0.7
raider.patrol.bulletSpeed=4.0
raider.patrol.summonGap=2.0
raider.patrol.summon.normal=3
raider.patrol.summon.shooter=1
raider.patrol.summon.bat=1

# Pattern 2: warning lane, charge down spraying bullets to both sides, then
# come back in from the top.
raider.charge.warning=1.0
raider.charge.speed=9
raider.charge.returnSpeed=3
raider.charge.fireGap=0.1
raider.charge.bulletSpeed=3.0

# Pattern 3: homing drones from every side; they chase the player for a
# while, then fly straight on and leave.
raider.drones.time=3.0
raider.drones.spawnGap=0.35
raider.drones.speed=2.6
raider.drones.turnDegrees=4
raider.drones.chaseTime=2.5
raider.drones.health=1
raider.drones.points=20

# ===== Both bosses =====
# After the boss hits the player (or a shield blocks the hit), seconds before it
# can hit again. Lasers, the rising attack, charge lanes and the raider's body
# stay on the ship for a while; without this they would take several lives or
# drain the shield at once. Covers the 1 s respawn plus time to move away.
common.hitGrace=2.0

# ===== Stage multipliers (same +5% per stage rule as normal stages) =====
# speed: movement, bulletSpeed: bullets, fireRate: divides gaps between shots.
stage5.speed=1.20
stage5.bulletSpeed=1.20
stage5.fireRate=1.20
stage10.speed=1.45
stage10.bulletSpeed=1.45
stage10.fireRate=1.45
